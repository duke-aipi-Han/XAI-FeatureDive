[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featuredive"
version = "0.1.0"
description = "Explore CNN explanations through attribution and controlled interventions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ml", "ml.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
